<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Members — DragonByte</title>

  <link rel="icon" href="/assets/img/logo-icon.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>

  <!-- Header -->
  <div id="site-header"></div>

  <main>

    <!-- Hero -->
    <section
      style="
        padding:96px 0;
        background:linear-gradient(145deg, #f8fafc, #eff6ff);
      "
    >
      <div class="container-sm text-center">

        <div style="font-size:3rem; margin-bottom:20px;">
          👥
        </div>

        <p class="eyebrow">
          COMMUNITY
        </p>

        <h1 class="h1 mb-3">
          DragonByte Members
        </h1>

        <p class="lead">
          Meet the members of the DragonByte cybersecurity community.
        </p>

      </div>
    </section>


    <!-- Members -->
    <section class="section">

      <div class="container">

        <div
          id="members-list"
          class="grid grid-3"
        >
          <div class="loading-text">
            Loading members…
          </div>
        </div>

      </div>

    </section>

  </main>


  <!-- Footer -->
  <div id="site-footer"></div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase connection -->
  <script src="/assets/js/supabase.js"></script>

  <!-- Layout -->
  <script src="/assets/js/layout.js"></script>


  <script>

    /*
     * HTML escape function
     * Prevents database content from breaking the page.
     */
    function esc(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * Get a value from multiple possible column names.
     *
     * This makes the page work if your Supabase table uses
     * name/name, role/position, bio/about, etc.
     */
    function getValue(row, names, fallback = "") {

      for (const name of names) {

        if (
          row[name] !== undefined &&
          row[name] !== null &&
          row[name] !== ""
        ) {
          return row[name];
        }

      }

      return fallback;

    }


    /*
     * Load members directly from Supabase
     */
    async function loadMembers() {

      const el = document.getElementById("members-list");

      try {

        console.log("DragonByte: Loading members from Supabase...");


        /*
         * IMPORTANT:
         * This directly queries the Supabase table.
         *
         * It does NOT use:
         * Api.get("/members")
         */
        const {
          data: members,
          error
        } = await supabaseClient
          .from("members")
          .select("*");


        /*
         * Show the actual Supabase error in console
         */
        if (error) {

          console.error(
            "Supabase members error:",
            error
          );

          throw error;

        }


        console.log(
          "DragonByte: Members received:",
          members
        );


        /*
         * No members
         */
        if (!members || members.length === 0) {

          el.innerHTML = `

            <div
              class="empty-state"
              style="grid-column:1/-1;"
            >

              <div
                class="icon"
                style="font-size:3rem;"
              >
                👥
              </div>

              <h3 class="h3 mb-1">
                No members yet
              </h3>

              <p class="text-sm text-muted mb-4">
                Member profiles will appear here
                as the DragonByte community grows.
              </p>

              <a
                href="/join.html"
                class="btn btn-primary btn-sm"
              >
                Join DragonByte
              </a>

            </div>

          `;

          return;

        }


        /*
         * Render members
         */
        el.innerHTML = members.map(member => {


          const name = getValue(
            member,
            [
              "name",
              "full_name",
              "fullName",
              "username",
              "display_name"
            ],
            "DragonByte Member"
          );


          const role = getValue(
            member,
            [
              "role",
              "position",
              "title",
              "designation"
            ],
            "Community Member"
          );


          const bio = getValue(
            member,
            [
              "bio",
              "about",
              "description"
            ],
            "DragonByte community member."
          );


          const avatar = getValue(
            member,
            [
              "avatar_url",
              "avatarUrl",
              "image_url",
              "imageUrl",
              "profile_image",
              "profileImage"
            ],
            ""
          );


          const github = getValue(
            member,
            [
              "github_url",
              "githubUrl",
              "github"
            ],
            ""
          );


          const linkedin = getValue(
            member,
            [
              "linkedin_url",
              "linkedinUrl",
              "linkedin"
            ],
            ""
          );


          return `

            <div
              class="card"
              style="
                padding:28px;
                text-align:center;
              "
            >

              <!-- Avatar -->

              <div
                style="
                  width:80px;
                  height:80px;
                  margin:0 auto 18px;
                  border-radius:50%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  overflow:hidden;
                  background:linear-gradient(
                    135deg,
                    #dbeafe,
                    #e0f2fe
                  );
                  font-size:2rem;
                  font-weight:700;
                  color:#1d4ed8;
                "
              >

                ${
                  avatar
                    ? `
                      <img
                        src="${esc(avatar)}"
                        alt="${esc(name)}"
                        style="
                          width:100%;
                          height:100%;
                          object-fit:cover;
                        "
                        onerror="
                          this.style.display='none';
                          this.parentElement.innerHTML='👤';
                        "
                      />
                    `
                    : `
                      ${esc(
                        name
                          .trim()
                          .charAt(0)
                          .toUpperCase()
                      ) || "👤"}
                    `
                }

              </div>


              <!-- Name -->

              <h3 class="h3 mb-1">
                ${esc(name)}
              </h3>


              <!-- Role -->

              <p
                class="text-sm"
                style="
                  color:var(--primary);
                  font-weight:600;
                "
              >
                ${esc(role)}
              </p>


              <!-- Bio -->

              <p
                class="text-sm text-muted"
                style="
                  margin-top:12px;
                  line-height:1.6;
                "
              >
                ${esc(bio)}
              </p>


              <!-- Social links -->

              ${
                github || linkedin
                  ? `

                    <div
                      style="
                        display:flex;
                        justify-content:center;
                        gap:8px;
                        flex-wrap:wrap;
                        margin-top:18px;
                      "
                    >

                      ${
                        github
                          ? `
                            <a
                              href="${esc(github)}"
                              target="_blank"
                              rel="noopener noreferrer"
                              class="btn btn-outline btn-sm"
                            >
                              GitHub
                            </a>
                          `
                          : ""
                      }


                      ${
                        linkedin
                          ? `
                            <a
                              href="${esc(linkedin)}"
                              target="_blank"
                              rel="noopener noreferrer"
                              class="btn btn-outline btn-sm"
                            >
                              LinkedIn
                            </a>
                          `
                          : ""
                      }

                    </div>

                  `
                  : ""
              }

            </div>

          `;

        }).join("");


      } catch (error) {

        console.error(
          "Failed to load members:",
          error
        );


        /*
         * Show useful error to the user
         */
        el.innerHTML = `

          <div
            class="empty-state"
            style="grid-column:1/-1;"
          >

            <div
              class="icon"
              style="font-size:3rem;"
            >
              ⚠️
            </div>

            <h3 class="h3 mb-1">
              Couldn't load members
            </h3>

            <p
              class="text-sm text-muted"
              style="margin-bottom:8px;"
            >
              There was a problem loading the
              DragonByte community members.
            </p>

            <p
              class="text-xs text-muted"
              style="
                max-width:600px;
                margin:0 auto;
                word-break:break-word;
              "
            >
              ${esc(
                error?.message ||
                "Supabase connection error"
              )}
            </p>

          </div>

        `;

      }

    }


    /*
     * Start after page loads
     */
    document.addEventListener(
      "DOMContentLoaded",
      loadMembers
    );

  </script>

</body>
</html>
