<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — DragonByte</title>

  <link rel="icon" href="/assets/img/logo-icon.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>

  <div id="site-header"></div>

  <main>

    <section style="padding:96px 0; background:linear-gradient(145deg, #f8fafc, #eff6ff);">
      <div class="container text-center">

        <span class="badge badge-blue mb-3">Open Source</span>

        <h1 class="h1 mb-3">
          Community Projects
        </h1>

        <p class="lead" style="max-width:560px; margin:0 auto;">
          Real-world security tools and open-source projects built by the DragonByte community.
        </p>

      </div>
    </section>


    <section class="section">
      <div class="container">

        <div id="projects-list" class="grid grid-3">
          <div class="loading-text">
            Loading projects…
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>


  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase connection -->
  <script src="/assets/js/supabase.js"></script>

  <!-- Header / Footer -->
  <script src="/assets/js/layout.js"></script>


  <script>

    async function loadProjects() {

      const el = document.getElementById("projects-list");

      try {

        console.log("Loading projects from Supabase...");

        const { data: projects, error } = await supabaseClient
          .from("projects")
          .select("*");

        if (error) {
          console.error("Supabase projects error:", error);
          throw error;
        }

        console.log("Projects received:", projects);


        if (!projects || projects.length === 0) {

          el.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">

              <div class="icon">🔧</div>

              <h3 class="h3 mb-1">
                No projects yet
              </h3>

              <p class="text-sm text-muted mb-4">
                Projects will appear here when they are published.
              </p>

              <a href="/join.html" class="btn btn-primary btn-sm">
                Join and contribute
              </a>

            </div>
          `;

          return;
        }


        el.innerHTML = projects.map(p => `

          <div class="card" style="padding:0; overflow:hidden;">

            <div
              style="
                height:160px;
                display:flex;
                align-items:center;
                justify-content:center;
                background:linear-gradient(135deg, #f0fdf4, #ecfeff);
                font-size:2.6rem;
              "
            >
              🔧
            </div>


            <div style="padding:20px;">

              <h3 class="h3 mb-1">
                ${esc(p.name)}
              </h3>


              <p class="text-sm text-muted mb-3">
                ${esc(p.description || "")}
              </p>


              ${
                Array.isArray(p.technologies) && p.technologies.length
                  ? `
                    <div
                      class="flex gap-2 mb-3"
                      style="flex-wrap:wrap;"
                    >

                      ${p.technologies
                        .slice(0, 3)
                        .map(t => `
                          <span
                            class="text-xs mono"
                            style="
                              color:#0891b2;
                              background:#ecfeff;
                              padding:2px 8px;
                              border-radius:6px;
                            "
                          >
                            ${esc(t)}
                          </span>
                        `)
                        .join("")}

                    </div>
                  `
                  : ""
              }


              <div
                class="flex gap-2"
                style="flex-wrap:wrap;"
              >

                ${
                  p.githubUrl
                    ? `
                      <a
                        href="${esc(p.githubUrl)}"
                        target="_blank"
                        rel="noopener"
                        class="btn btn-outline btn-sm"
                      >
                        GitHub
                      </a>
                    `
                    : ""
                }


                ${
                  p.demoUrl
                    ? `
                      <a
                        href="${esc(p.demoUrl)}"
                        target="_blank"
                        rel="noopener"
                        class="btn btn-primary btn-sm"
                      >
                        Live Demo
                      </a>
                    `
                    : ""
                }


                ${
                  p.resourceUrl
                    ? `
                      <a
                        href="${esc(p.resourceUrl)}"
                        target="_blank"
                        rel="noopener"
                        class="btn btn-outline btn-sm"
                      >
                        📎 Resource
                      </a>
                    `
                    : ""
                }

              </div>

            </div>

          </div>

        `).join("");


      } catch (error) {

        console.error("Failed to load projects:", error);

        el.innerHTML = `
          <div
            class="empty-state"
            style="grid-column:1/-1;"
          >

            <div class="icon">⚠️</div>

            <h3 class="h3 mb-1">
              Couldn't load projects
            </h3>

            <p class="text-sm text-muted">
              ${esc(error.message || "Supabase connection error")}
            </p>

          </div>
        `;

      }

    }


    document.addEventListener(
      "DOMContentLoaded",
      loadProjects
    );

  </script>

</body>
</html>
