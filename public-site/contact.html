<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — DragonByte</title>
  <link rel="icon" href="/assets/img/logo-icon.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section style="min-height:70vh; display:flex; align-items:center; padding:80px 0; background:linear-gradient(145deg, #f8fafc, #eff6ff);">
      <div class="container-sm" style="width:100%;">

        <div id="contact-success" class="text-center hidden">
          <div style="font-size:3rem; margin-bottom:16px;">✅</div>
          <h2 class="h2 mb-2">Message sent!</h2>
          <p class="text-muted">We'll get back to you as soon as we can.</p>
          <a href="/index.html" class="btn btn-primary mt-4">Back to Home</a>
        </div>

        <div id="contact-form-wrap">
          <div class="text-center mb-6">
            <p class="eyebrow">Get in touch</p>
            <h1 class="h1 mb-2">Contact Us</h1>
            <p class="lead">Questions, partnership ideas, or feedback — we'd love to hear from you.</p>
          </div>

          <form id="contact-form" class="card">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>
            <div class="field">
              <label for="subject">Subject</label>
              <input id="subject" name="subject" required />
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <p id="contact-error" class="form-error hidden"></p>
            <button type="submit" id="contact-submit" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>

      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("contact-submit");
      const errEl = document.getElementById("contact-error");
      errEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Sending…";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value,
      };

      try {
        await Api.post("/contact", payload);
        document.getElementById("contact-form-wrap").classList.add("hidden");
        document.getElementById("contact-success").classList.remove("hidden");
      } catch (err) {
        errEl.textContent = err.message || "Something went wrong. Please try again.";
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Send Message";
      }
    });
  </script>
</body>
</html>
