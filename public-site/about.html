<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DragonByte Admin</title>

  <link rel="icon" href="/assets/img/logo-icon.png">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    /* =========================================================
       DragonByte Admin
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f8fc;
      color: #0f172a;
      font-family: Inter, Arial, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       LOGIN
       ========================================================= */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.10), transparent 35%),
        #f8fafc;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 36px;
      box-shadow: 0 25px 70px rgba(15,23,42,.10);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
    }

    .login-card h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .login-card p {
      margin: 8px 0 28px;
      text-align: center;
      color: #64748b;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .login-field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      outline: none;
    }

    .login-field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    #login-submit {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      margin-top: 8px;
    }

    #login-submit:hover {
      background: #1d4ed8;
    }

    .login-error {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 14px;
    }

    /* =========================================================
       ADMIN SHELL
       ========================================================= */

    #admin-shell {
      min-height: 100vh;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 250px;
      flex-shrink: 0;
      background: #0f172a;
      color: white;
      padding: 22px 14px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 10px 24px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      margin-bottom: 18px;
    }

    .admin-brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .admin-brand strong {
      font-size: 18px;
    }

    .admin-brand span {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
    }

    #admin-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .admin-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      transition: .2s;
    }

    .admin-nav-item:hover {
      background: rgba(255,255,255,.08);
      color: white;
    }

    .admin-nav-item.active {
      background: #2563eb;
      color: white;
      font-weight: 700;
    }

    .admin-main {
      margin-left: 250px;
      width: calc(100% - 250px);
      min-height: 100vh;
    }

    .admin-topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .admin-topbar h2 {
      margin: 0;
      font-size: 22px;
    }

    #logout-btn {
      border: 1px solid #e2e8f0;
      background: white;
      padding: 9px 14px;
      border-radius: 9px;
      color: #334155;
      font-weight: 600;
    }

    #logout-btn:hover {
      background: #f8fafc;
    }

    .admin-content {
      padding: 28px;
      max-width: 1500px;
      margin: auto;
    }

    /* =========================================================
       DASHBOARD
       ========================================================= */

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stat-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(15,23,42,.04);
    }

    .stat-card .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 26px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 800;
    }

    .text-sm {
      font-size: 14px;
    }

    /* =========================================================
       ENTITY MANAGER
       ========================================================= */

    .entity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 15px;
    }

    .entity-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .entity-table-wrap {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow-x: auto;
    }

    .entity-table {
      width: 100%;
      border-collapse: collapse;
    }

    .entity-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-align: left;
    }

    .entity-table th,
    .entity-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .entity-table tr:last-child td {
      border-bottom: 0;
    }

    .entity-table td {
      font-size: 14px;
    }

    .entity-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .entity-actions button {
      padding: 7px 10px;
      border-radius: 7px;
      border: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-btn {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .entity-form-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 17px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(15,23,42,.04);
    }

    .entity-form-card h3 {
      margin: 0 0 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 17px;
    }

    .form-field {
      min-width: 0;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
      outline: none;
    }

    .form-field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .field-check {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
    }

    .field-check input {
      width: auto;
    }

    .form-actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =========================================================
       IMAGE UPLOAD
       ========================================================= */

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      background: #f8fafc;
    }

    .upload-box:hover {
      border-color: #2563eb;
    }

    .upload-box input[type="file"] {
      border: 0;
      padding: 0;
      background: transparent;
    }

    .upload-help {
      color: #64748b;
      font-size: 12px;
      margin-top: 7px;
    }

    .image-preview {
      width: 110px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-top: 10px;
      background: #e2e8f0;
    }

    .profile-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
    }

    .upload-progress {
      margin-top: 9px;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
    }

    /* =========================================================
       ALERTS
       ========================================================= */

    .form-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .form-success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1000px) {
      .grid-3 {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 760px) {
      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .admin-layout {
        display: block;
      }

      .admin-main {
        margin-left: 0;
        width: 100%;
      }

      #admin-nav {
        display: grid;
        grid-template-columns: repeat(2,1fr);
      }

      .admin-content {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: auto;
      }

      .grid-3 {
        grid-template-columns: 1fr;
      }

      .admin-topbar {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       LOGIN SCREEN
       ========================================================= -->

  <section id="login-screen">

    <div class="login-card">

      <img
        src="/assets/img/logo-icon.png"
        alt="DragonByte"
        class="login-logo"
      >

      <h1>DragonByte Admin</h1>

      <p>Manage your cybersecurity community</p>

      <form id="login-form">

        <div class="login-field">
          <label for="login-username">Email</label>

          <input
            id="login-username"
            type="email"
            autocomplete="username"
            placeholder="admin@example.com"
            required
          >
        </div>

        <div class="login-field">
          <label for="login-password">Password</label>

          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
        </div>

        <button
          id="login-submit"
          type="submit"
        >
          Sign In
        </button>

        <div
          id="login-error"
          class="login-error hidden"
        ></div>

      </form>

    </div>

  </section>


  <!-- =========================================================
       ADMIN SHELL
       ========================================================= -->

  <section id="admin-shell" class="hidden">

    <div class="admin-layout">

      <!-- SIDEBAR -->

      <aside class="admin-sidebar">

        <div class="admin-brand">

          <img
            src="/assets/img/logo-icon.png"
            alt="DragonByte"
          >

          <div>
            <strong>DragonByte</strong>
            <span>ADMIN PANEL</span>
          </div>

        </div>

        <nav id="admin-nav"></nav>

      </aside>


      <!-- MAIN -->

      <main class="admin-main">

        <header class="admin-topbar">

          <h2 id="section-title">
            Dashboard
          </h2>

          <button id="logout-btn">
            Logout
          </button>

        </header>

        <div class="admin-content">

          <div id="section-content"></div>

        </div>

      </main>

    </div>

  </section>


  <!-- =========================================================
       SUPABASE
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your existing API -->
  <script src="/assets/js/api.js"></script>

  <!-- Admin -->
  <script src="/assets/js/admin.js"></script>

</body>
</html>
