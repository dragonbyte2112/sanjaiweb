<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — DragonByte</title>
  <link rel="icon" href="/assets/img/logo-icon.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section style="padding:96px 0; background:linear-gradient(145deg, #f8fafc, #eff6ff);">
      <div class="container text-center">
        <span class="badge badge-blue mb-3">Events</span>
        <h1 class="h1 mb-3">Community Events</h1>
        <p class="lead" style="max-width:560px; margin:0 auto;">CTF competitions, workshops, meetups, and more — all in one place.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div id="events-list" class="grid grid-3"><div class="loading-text">Loading events…</div></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    async function loadEvents() {
      const el = document.getElementById("events-list");
      try {
        const events = await Api.get("/events");
        if (!events.length) {
          el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
            <div class="icon">📅</div>
            <h3 class="h3 mb-1">No upcoming events yet</h3>
            <p class="text-sm text-muted mb-4">Stay connected for what's next. New events are posted regularly.</p>
            <a href="/join.html" class="btn btn-primary btn-sm">Join to get notified</a>
          </div>`;
          return;
        }
        el.innerHTML = events.map(e => `
          <div class="card" style="padding:0; overflow:hidden;">
            <div style="height:160px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #eff6ff, #e0f2fe); font-size:2.6rem;">📅</div>
            <div style="padding:20px;">
              <span class="badge badge-blue">${esc(e.category || "Event")}</span>
              <h3 class="h3 mt-2 mb-1">${esc(e.title)}</h3>
              <p class="text-sm text-muted mb-3">${esc(e.description || "")}</p>
              <div class="text-xs text-muted mb-3">📍 ${esc(e.location || "TBA")} &nbsp;·&nbsp; 🗓 ${esc(e.date || "TBA")}</div>
              ${e.registrationUrl ? `<a href="${esc(e.registrationUrl)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Register</a>` : ""}
            </div>
          </div>
        `).join("");
      } catch {
        el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">⚠️</div><h3 class="h3 mb-1">Couldn't load events</h3><p class="text-sm text-muted">Is the backend server running?</p></div>`;
      }
    }
    document.addEventListener("DOMContentLoaded", loadEvents);
  </script>
</body>
</html>
